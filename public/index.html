<style>
:root{

  --blue:#1F6FEB; --blue-ink:#1756C2; --blue-bg:#EAF1FE;
  --orange:#E8590C; --orange-btn:#D9480F; --orange-ink:#A93A06; --orange-bg:#FDEBDD;
  --gray:#9AA1AC; --red:#C92A2A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:16px}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative}
.scr{min-height:100dvh;position:relative}
.pad{padding:calc(env(safe-area-inset-top) + 24px) 18px calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:28px;font-weight:900;letter-spacing:-.3px}
.card{background:var(--card);border-radius:16px;padding:14px 16px}
.row{display:flex;align-items:center;gap:10px}
.sub{color:var(--sub);font-size:14px}
.small{font-size:13px}
.big{width:100%;min-height:62px;border:0;border-radius:18px;font-size:20px;font-weight:900;padding:0 16px}
.big.blue{background:var(--blue);color:#fff}
.big.orange{background:var(--orange-btn);color:#fff}
.big.dark{background:var(--ink);color:#fff}
.big.gray{background:#E9ECF0;color:var(--sub);cursor:default;display:flex;align-items:center;justify-content:center;gap:8px;font-size:18px}
.mid{width:100%;min-height:52px;border:2px solid #D5DAE1;border-radius:14px;background:#fff;font-weight:700;font-size:17px}
.mid.wish{border-color:var(--orange);background:var(--orange-bg);color:var(--orange-ink)}
.chipbtn{min-height:44px;padding:0 14px;border:2px solid #D5DAE1;border-radius:12px;background:#fff;font-weight:700;font-size:15px}
.chipbtn.on{border-color:var(--ink);background:var(--ink);color:#fff}
.link{border:0;background:transparent;color:var(--sub);font-size:15px;min-height:44px;padding:0 6px}
.input{height:56px;border-radius:14px;border:2px solid #D5DAE1;padding:0 16px;font-size:18px;background:#fff;width:100%}
.input:focus{outline:none;border-color:var(--blue)}
.err{background:#FFE3E3;color:#A51D1D;border-radius:12px;padding:10px 14px;font-size:15px;font-weight:700}
.warnbox{background:#FFF3BF;color:#5C4400;border-radius:12px;padding:10px 14px;font-size:14px}
.chip{font-size:12px;font-weight:700;border-radius:8px;padding:3px 8px;white-space:nowrap}
.c-host{background:#E9ECF0;color:#3A404A}
.c-wish{background:var(--orange-bg);color:var(--orange-ink)}
.c-warn{background:#FFE3E3;color:#A51D1D}
.c-ok{background:#E3F4E4;color:#1F6B2A}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:10px 14px;min-height:56px}
.av{width:36px;height:36px;border-radius:18px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.tg{width:56px;height:32px;border-radius:16px;border:0;padding:4px;display:flex;flex:none}
.tg span{width:24px;height:24px;border-radius:12px;background:#fff;display:block}
.tg.on{background:var(--blue);justify-content:flex-end}
.tg.off{background:#C9CED6;justify-content:flex-start}
.mapcard{position:relative;height:190px;border-radius:16px;overflow:hidden;background:#E6EBEF}
.mapcard .map{position:absolute;inset:0}
.maptag{position:absolute;left:10px;top:10px;z-index:500;background:rgba(255,255,255,.95);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700}
.mapbtn{position:absolute;right:10px;top:10px;z-index:500;background:var(--ink);color:#fff;border:0;border-radius:10px;min-height:36px;padding:0 12px;font-size:13px;font-weight:700}
.full{position:fixed;inset:0;max-width:480px;margin:0 auto;background:#E6EBEF}
.topbar{position:fixed;left:50%;transform:translateX(-50%);width:calc(min(480px,100vw) - 20px);top:calc(env(safe-area-inset-top) + 10px);z-index:600;background:#fff;border-radius:18px;padding:8px 10px 8px 14px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 16px rgba(21,23,26,.14)}

.r-runner{background:var(--blue-bg);color:var(--blue-ink)}

.banner{position:fixed;left:50%;transform:translateX(-50%);width:calc(min(480px,100vw) - 20px);top:calc(env(safe-area-inset-top) + 82px);z-index:590;border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700;text-align:center}
.locbtn{position:fixed;right:max(12px,calc(50vw - 228px));bottom:calc(env(safe-area-inset-bottom) + 190px);z-index:600;width:48px;height:48px;border-radius:24px;border:0;background:#fff;box-shadow:0 2px 10px rgba(21,23,26,.2);display:flex;align-items:center;justify-content:center}
.bottom{position:fixed;left:50%;transform:translateX(-50%);width:min(480px,100vw);bottom:0;z-index:600;background:#fff;border-radius:24px 24px 0 0;padding:12px 16px calc(env(safe-area-inset-bottom) + 18px);box-shadow:0 -4px 20px rgba(21,23,26,.12);display:flex;flex-direction:column;gap:8px}
.hint{font-size:14px;color:var(--sub);text-align:center}
.report{display:flex;gap:8px;align-items:center}

.ov{position:fixed;inset:0;z-index:900;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:28px}
.ov.red{background:var(--red);color:#fff}
.ov.dark{background:rgba(21,23,26,.95);color:#fff}
.ov h2{margin:0;font-size:32px;font-weight:900}

.ov .count{font-size:80px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.ov .pill{font-size:14px;background:rgba(0,0,0,.25);border-radius:20px;padding:6px 14px}
.sheet{position:fixed;inset:0;z-index:950;background:rgba(21,23,26,.5);display:flex;flex-direction:column;justify-content:flex-end}
.sheet .in{background:#fff;border-radius:24px 24px 0 0;padding:22px 18px calc(env(safe-area-inset-bottom) + 22px);display:flex;flex-direction:column;gap:12px;max-height:88dvh;overflow:auto;width:100%;max-width:480px;margin:0 auto}
.sheet h3{margin:0;font-size:24px;font-weight:900;text-align:center}
.album{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.album figure{margin:0;aspect-ratio:1;border-radius:10px;background:#DDE2E8;overflow:hidden;position:relative}
.album img{width:100%;height:100%;object-fit:cover;display:block}
.album figcaption{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:11px;font-weight:700;padding:10px 6px 4px}
.toasts{position:fixed;left:50%;transform:translateX(-50%);width:calc(min(480px,100vw) - 36px);top:calc(env(safe-area-inset-top) + 130px);z-index:1000;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;font-size:15px;font-weight:700;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.net{position:fixed;left:0;right:0;top:0;z-index:1100;background:#15171A;color:#fff;text-align:center;font-size:14px;font-weight:700;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
.form{display:flex;flex-direction:column;gap:10px}
.form h4{margin:10px 0 0;font-size:14px;color:var(--sub)}
.frow{display:flex;align-items:center;gap:10px;min-height:44px}
.frow label{flex:1;min-width:0}
.frow label b{display:block;font-size:15px;font-weight:600}
.frow label small{display:block;font-size:12.5px;color:var(--sub);line-height:1.4;margin-top:2px}
.frow.sub{margin-left:6px;padding-left:12px;border-left:3px solid #E3E7EC}
.form .hide,.form .advbox{display:none}
.form.more .advbox{display:flex;flex-direction:column;gap:10px}
.form.more .advbox .hide{display:none}
.form input[type=number],.form select{height:44px;border:2px solid #D5DAE1;border-radius:10px;padding:0 8px;background:#fff;font-size:16px}
.form select{width:150px;flex:none}
.unit{display:flex;align-items:center;gap:4px;flex:none;font-size:15px}
.unit input[type=number]{width:64px;text-align:right}
.tm input[type=number]{width:52px}
.leaflet-container{isolation:isolate}
.etop{position:fixed;left:50%;transform:translateX(-50%);width:calc(min(480px,100vw) - 20px);top:calc(env(safe-area-inset-top) + 10px);z-index:600;box-shadow:0 4px 16px rgba(21,23,26,.14)}
.ebottom{position:fixed;left:50%;transform:translateX(-50%);width:min(480px,100vw);bottom:0;z-index:600;background:#fff;border-radius:24px 24px 0 0;padding:12px 16px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;gap:10px;box-shadow:0 -4px 20px rgba(21,23,26,.12)}
.tk{position:relative}
.tk i{position:absolute;left:-10px;top:-10px;width:20px;height:20px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.35)}
.tk i.me{left:-13px;top:-13px;width:26px;height:26px;box-shadow:0 0 0 9px rgba(31,111,235,.22),0 2px 5px rgba(0,0,0,.35)}
.tk i.st{opacity:.7;border-style:dashed}
.tk span{position:absolute;top:14px;left:0;transform:translateX(-50%);white-space:nowrap;font-size:13px;font-weight:700;color:#15171A;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;pointer-events:none}
.jl{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:13px;font-weight:700;color:#15171A;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:#3A404A;justify-content:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:4px;vertical-align:-1px}
.sr{position:absolute;left:-9999px}
.ov.red{z-index:1001}
.radar{display:flex;flex-direction:column;gap:6px;background:#F6F7F9;border-radius:14px;padding:8px 12px}
.radar .rrow{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.radar .rrow span.l{width:56px;flex:none;color:#3A404A}
.bars{display:flex;gap:3px;flex:1}
.bars i{flex:1;height:10px;border-radius:3px;background:#DDE2E8}
.bars.range i.on{background:#E8590C}
.bars.sight i.on{background:#1F6FEB}
.lockbtn{position:fixed;left:max(12px,calc(50vw - 228px));bottom:calc(env(safe-area-inset-bottom) + 190px);z-index:600;height:48px;padding:0 14px;border-radius:24px;border:0;background:#15171A;color:#fff;font-weight:700;font-size:15px;box-shadow:0 2px 10px rgba(21,23,26,.25);display:flex;align-items:center;gap:6px}
.lock{position:fixed;inset:0;z-index:990;background:rgba(0,0,0,.94);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 40px) 24px calc(env(safe-area-inset-bottom) + 40px);text-align:center;touch-action:none;-webkit-user-select:none;user-select:none}
.lock .big-t{font-size:64px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.lock .note{background:rgba(255,255,255,.12);border-radius:14px;padding:10px 14px;font-size:16px;font-weight:700}
.unlock{width:96px;height:96px;border-radius:48px;border:0;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center;position:relative;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.unlock svg.ring{position:absolute;inset:0;transform:rotate(-90deg)}
.holdbtn{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
.vote{display:flex;gap:8px}
.vote button{flex:1;min-height:56px;border-radius:14px;font-size:18px;font-weight:900;border:2px solid #D5DAE1;background:#fff}
.vote button.on-yes{background:var(--orange-btn);border-color:var(--orange-btn);color:#fff}
.vote button.on-no{background:var(--ink);border-color:var(--ink);color:#fff}
</style>

<body>
<div id="app"></div>
<div id="net"></div>
<div id="lockOv"></div>
<div class="toasts" id="toasts"></div>
<input type="file" id="photoInput" accept="image/*" capture="environment" class="sr" aria-hidden="true" tabindex="-1">
<script>
(function(){
'use strict';

// ===================== 공통 =====================
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TN = { tag:['술래','도망자'], hide:['술래','숨는 사람'], cops:['경찰','도둑'], zombie:['좀비','생존자'] };
const MODE_NAME = { tag:'술래잡기', hide:'숨바꼭질', cops:'경찰과 도둑', zombie:'좀비감염' };
const TILE = { url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png', opt:{ maxZoom:19, attribution:'&copy; OpenStreetMap' } };
function ls(k, v){ try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch(e){ return null; } }
function rid(){ const a = new Uint8Array(16); crypto.getRandomValues(a); return Array.from(a, b => b.toString(16).padStart(2,'0')).join(''); }
function fmt(sec){ const s = Math.max(0, Math.ceil(sec)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
function setHTML(el, html){ if (el && el._h !== html) { el.innerHTML = html; el._h = html; } }

const C = {
  token: ls('gt_token') || (() => { const t = rid(); ls('gt_token', t); return t; })(),
  name: ls('gt_name') || '',
  code: ls('gt_room') || null,
  sound: ls('gt_sound') !== '0',
  ws: null, open: false, wantConn: false, retry: 0, st: null, offset: 0,
  screen: null, err: '', joinOpen: false, editor: null, settingsOpen: false, bigMap: false,
  askReport: false, albumOpen: false, photos: {}, photoAsked: {}, wake: null, geoErr: null, geoWatch: null, lastPosSent: 0, pos: null
};
const params = new URLSearchParams(location.search);
if (params.get('room')) { C.joinCode = params.get('room').toUpperCase().slice(0,4); C.joinOpen = true; if (C.code !== C.joinCode) C.code = null; }
const serverNow = () => Date.now() + C.offset;
const me = () => C.st && C.st.me;
const S = () => C.st ? C.st.settings : null;
const cw = () => TN[S() ? S().mode : 'tag'][0];
const rw = () => TN[S() ? S().mode : 'tag'][1];

// ===================== 소리·진동 =====================
let audio = null;
function unlockAudio(){
  // 아이폰(iOS 16.4+): 'playback'으로 두면 무음 스위치를 켜도 소리가 나요
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch(e){}
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (audio && audio.state === 'suspended') audio.resume();
}
// 사이렌: 낮은음↔높은음을 오가는 큰 경보음
function siren(sec){
  if (!audio) return;
  try {
    const t = audio.currentTime, d = sec || 0.9;
    const o = audio.createOscillator(), g = audio.createGain(), o2 = audio.createOscillator();
    o.type = 'sawtooth'; o2.type = 'square';
    for (let k = 0; k < d / 0.3; k++) {
      o.frequency.setValueAtTime(k % 2 ? 1400 : 760, t + k * 0.3); o.frequency.linearRampToValueAtTime(k % 2 ? 760 : 1400, t + (k + 1) * 0.3);
      o2.frequency.setValueAtTime(k % 2 ? 1402 : 762, t + k * 0.3); o2.frequency.linearRampToValueAtTime(k % 2 ? 762 : 1402, t + (k + 1) * 0.3);
    }
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.45, t + 0.03); g.gain.setValueAtTime(0.45, t + d - 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); o2.connect(g); g.connect(audio.destination); o.start(t); o2.start(t); o.stop(t + d); o2.stop(t + d);
  } catch(e){}
}
function beep(f){
  if (!audio) return;
  try { const o = audio.createOscillator(), g = audio.createGain(); o.type = 'square'; o.frequency.value = f || 880; g.gain.value = 0.08; o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + 0.18); } catch(e){}
}
function buzz(p){ if (navigator.vibrate) try { navigator.vibrate(p); } catch(e){} }
document.addEventListener('pointerdown', unlockAudio, { capture:true });

// ===================== 토스트 =====================
function toast(text){
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = text;
  const box = $('#toasts'); box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => el.remove(), 3200);
}

// ===================== 연결 =====================
function connect(){
  if (!C.code) return;
  C.wantConn = true;
  try { if (C.ws) C.ws.close(); } catch(e){}
  const url = (location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host + '/ws/' + C.code + '?token=' + C.token + '&name=' + encodeURIComponent(C.name) + (C.takeover ? '&takeover=1' : '');
  C.takeover = false; C.idle = false; C.idleAuto = false;
  const ws = new WebSocket(url); C.ws = ws;
  ws.onopen = () => { C.open = true; C.retry = 0; if (C.pos) sendPos(true); resubscribePush(); if (document.visibilityState === 'hidden') send({ type:'away' }); render(); };
  ws.onmessage = e => {
    let m; try { m = JSON.parse(e.data); } catch(err){ return; }
    if (m.type === 'state') { C.st = m; C.offset = m.now - Date.now(); C.stVer = (C.stVer || 0) + 1; render(); }
    else if (m.type === 'toast') { toast(m.text); }
    else if (m.type === 'photo') { if (/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(m.data)) { C.photos[m.id] = m.data; render(); } }
    else if (m.type === 'error') { C.dup = m.code === 'dupname' ? { canTakeover:m.canTakeover, code:C.code } : null; C.err = m.text; leaveRoom(true); }
    else if (m.type === 'idle') { C.idle = true; C.wantConn = false; }
    else if (m.type === 'left') { leaveRoom(true); }
  };
  ws.onclose = e => {
    if (C.ws !== ws) return;
    if (e.code === 4010 || C.idle) { C.idle = true; C.wantConn = false; C.open = false; render(); return; }
    if (e.code === 4003 || e.code === 4004 || e.code === 4001) { C.open = false; return; }
    if (e.code === 4002) { C.err = '다른 화면(홈 화면 앱 등)에서 같은 이름으로 들어와서 여기는 연결을 끊었어요'; leaveRoom(true); return; }
    C.open = false;
    if (C.wantConn && C.code) { const d = Math.min(5000, 800 * Math.pow(2, C.retry++)); setTimeout(() => { if (C.wantConn && C.ws === ws) connect(); }, d); }
    render();
  };
  startGeo();
}
function send(o){ if (C.ws && C.open) try { C.ws.send(JSON.stringify(o)); } catch(e){} }
function leaveRoom(silent){

function drawTokens(lay, tokens){
  (tokens || []).forEach(t => {

    const lb = t.kind === 'me' ? '나' : t.name + (t.kind === 'out' ? ' · 아웃' : '') + (t.stale != null ? ' · ' + t.stale + '초 전' : '') + (t.pub ? ' · 공개' : '') + (t.disc ? ' · 끊김' : '') + (t.jailed ? ' · 수감' : '') + (t.escort ? ' · 연행 중' : '');

    L.marker([t.lat, t.lng], { icon:L.divIcon({ className:'', html:h, iconSize:[0,0] }), interactive:false, keyboard:false, zIndexOffset:t.kind === 'me' ? 1000 : 0 }).addTo(lay);
  });
}

function wantScreen(){
  if (C.idle && C.code) return 'idle';
  if (!C.code) return 'start';
  if (!C.st) return 'connecting';
  if ((C.st.phase === 'playing' || C.st.phase === 'hiding') && C.st.me.late) return 'waiting';
  if (C.st.phase === 'lobby') return C.editor ? 'editor' : 'lobby';
  if (C.st.phase === 'ended') return 'result';
  return 'game';
}

function render(){
  const w = wantScreen();

    maps.forEach(m => { try { m.remove(); } catch(e){} }); maps = [];
    if (C.wake && w !== 'game') { try { C.wake.release(); } catch(e){} C.wake = null; }

  else setHTML($('#lockOv'), C.locked && C.screen === 'game' ? lockScreen() : '');
}

function inPolyLL(pt, poly){

  setHTML($('#gBottom'), b);

  if (st.vote) ov += voteSheet(st.vote);

};
function albumSheet(album){
  const items = album.slice().reverse().map(a => {
    if (!C.photos[a.id] && !C.photoAsked[a.id]) { C.photoAsked[a.id] = 1; send({ type:'photoGet', id:a.id }); }
    return '<figure>' + (C.photos[a.id] ? '<img src="' + esc(C.photos[a.id]) + '" alt="' + esc(a.from) + '님이 보낸 사진">' : '') + '<figcaption>' + esc(a.from) + ' · ' + fmt(a.at) + ' 남았을 때</figcaption></figure>';
  }).join('');
  return '<div class="sheet"><div class="in"><h3>사진 ' + album.length + '장</h3>' + (album.length ? '<div class="album">' + items + '</div>' : '<div class="sub" style="text-align:center">아직 받은 사진이 없어요</div>') + '<button class="big dark" data-act="albumClose">닫기</button></div></div>';
}

// 규칙·주의사항 (친구들 양심을 믿고 문구로 안내해요)
function rulesList(st, m){
  const s = st.settings, c = cw(), r = rw(), mode = s.mode;
  const common = [
    '<b>폰 화면은 켜 둔 채로</b> 주머니에 넣어요. 오작동은 <b>주머니 잠금</b>으로 막아요',
    '<b>잡히면 바로 "잡혔어요"</b>를 눌러요',
    '파란 점선 밖으로 나가지 않기. 뛸 때 <b>차도·계단</b> 조심'
  ];
  const wait = '숨는 시간엔 ' + (mode === 'zombie' ? '첫 좀비' : c) + '는 <b>눈 감고 제자리</b>에서 기다려요';
  const by = {
    tag: [wait].concat(s.transfer ? ['잡힌 사람이 새 술래가 돼요. 끝날 때 술래인 사람이 져요'] : []),
    hide: [wait, '숨은 뒤엔 <b>되도록 움직이지 않기</b>'].concat(s.transfer ? ['잡힌 사람이 새 술래가 돼요. 끝날 때 술래인 사람이 져요'] : []),
    cops: [wait, '체포되면 <b>경찰을 따라 감옥까지</b> 가요 (탈출 불가)', '경찰은 감옥 바로 옆에서 지키지 않기'],
    zombie: [wait, '감염되면 <b>10초 뒤</b> 좀비가 돼요']
  };
  const extra = [];
  if (s.radarRangeOn || s.radarSightOn) extra.push('<b>레이더:</b> ' + r + '가 가까이 있으면 ' + c + ' 폰에서 소리가 나요');
  if (s.photoOn) extra.push('<b>사진:</b> ' + dur(s.photoEvery) + '마다 사진을 보내야 해요. 늦으면 위치가 공개돼요');
  return (by[mode] || []).concat(extra, common);
}
function rulesSheet(st, m, ackAct){
  const items = rulesList(st, m);
  return '<div class="sheet" style="z-index:990"><div class="in"><h3>' + MODE_NAME[st.settings.mode] + ' 규칙 · 주의사항</h3>' +
    '<div class="sub" style="text-align:center">나는 <b>' + (m.state === 'out' ? '관전' : (m.role === 'chaser' ? cw() : rw())) + '</b>예요' + (m.push ? ' · 알림 켜짐' : '') + '</div>' +
    '<ol style="margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.5">' + items.map(t => '<li>' + t + '</li>').join('') + '</ol>' +
    '<button class="big blue" data-act="' + ackAct + '">알겠어요</button></div></div>';
}

// 참가자 목록 (방장은 탈락 투표를 열 수 있어요)
function playersSheet(st, m){
  const rows = st.players.filter(p => !p.late).map(p => {
    const stTxt = p.state === 'out' ? '아웃' : p.state === 'jailed' ? '수감' : p.state === 'escort' ? '연행 중' : p.state === 'pending' ? '신고 중' : '게임 중';
    const conn = p.connected ? '' : '<span class="chip c-warn">끊김 ' + fmt(p.discFor) + '</span>';
    const canKick = m.host && p.id !== m.id && p.state !== 'out' && !st.vote;
    return '<div class="item"><div class="av">' + esc(p.name.charAt(0)) + '</div><div style="flex:1;min-width:0"><div style="font-weight:700">' + esc(p.name) + (p.host ? ' · 방장' : '') + '</div><div class="sub small">' + (p.role === 'chaser' ? cw() : rw()) + ' · ' + stTxt + '</div></div>' + conn +
      (canKick ? '<button class="chipbtn" data-act="kickAsk" data-id="' + p.id + '" style="min-height:40px;padding:0 10px">탈락 투표</button>' : '') + '</div>';
  }).join('');
  return '<div class="sheet"><div class="in"><h3>참가자</h3>' + (m.host ? '<div class="sub small" style="text-align:center">연결이 ' + Math.round(st.settings.autoOut / 60) + '분 넘게 끊긴 사람은 자동으로 탈락해요. 그 전에 빼야 하면 탈락 투표를 열어요.</div>' : '') + '<div class="list">' + rows + '</div><button class="mid" data-act="rulesOpen">규칙 보기</button><button class="big dark" data-act="playersClose">닫기</button><button class="link" data-act="leave" style="align-self:center">게임 나가기</button></div></div>';
}
function voteSheet(v){
  const status = '찬성 ' + v.yes + ' · 반대 ' + v.no + ' / ' + v.total + '명 (찬성 ' + v.need + '명이면 탈락) · 남은 ' + Math.ceil(v.left) + '초';

  if (v.canVote) return '<div class="sheet" style="z-index:985"><div class="in" style="text-align:center"><h3>' + esc(v.targetName) + '님을 탈락시킬까요?</h3><div class="sub">' + esc(v.byName) + '님이 투표를 열었어요' + (v.targetConnected ? '' : ' · ' + esc(v.targetName) + '님은 지금 연결이 끊겨 있어요') + '</div><div class="sub small">' + status + '</div>' +
    '<div class="vote"><button data-act="voteNo" class="' + (v.myVote === 'no' ? 'on-no' : '') + '">반대</button><button data-act="voteYes" class="' + (v.myVote === 'yes' ? 'on-yes' : '') + '">찬성 (탈락)</button></div></div></div>';

// 주머니 잠금 화면: 터치를 막고, 중요한 소식만 크게 보여줘요
function lockScreen(){
  const st = C.st, m = me(); if (!st || !m) return '';
  const now = serverNow(), hiding = st.phase === 'hiding';
  const left = ((hiding ? st.hideEndsAt : st.endsAt) - now) / 1000;
  const notes = [];
  if (m.role === 'chaser' && st.reports && st.reports.length) notes.push('잡혔다는 신고 ' + st.reports.length + '건이 왔어요 · 잠금을 풀고 확인하세요');
  if (m.photoLeft != null) notes.push('사진 보낼 시간이에요 · ' + fmt(m.photoLeft) + ' 남음');
  if (st.vote && (st.vote.canVote || st.vote.isTarget)) notes.push('탈락 투표가 열렸어요 · 잠금을 풀어 주세요');
  if (m.state === 'escort' && m.escort) notes.push(m.escort.name + '님에게 연행 중 · 경찰과 ' + m.escort.dist + 'm');
  if (m.busy && m.escort) notes.push(m.escort.name + '님 연행 중 · 감옥까지 ' + m.escort.jailDist + 'm');
  if (m.state === 'pending') notes.push(cw() + '의 확인을 기다리는 중');
  if (m.radar && st.settings.radarSightOn) notes.push('시야 레이더는 잠금 중엔 꺼져요' + (st.settings.radarRangeOn ? ' · 범위 레이더는 작동해요' : ''));
  const pct = Math.min(1, C.unlockP || 0), circ = 2 * Math.PI * 44;
  return '<div class="lock" id="lockEl"><div style="display:flex;flex-direction:column;gap:10px;align-items:center"><div class="sub" style="color:#C9CED6">' + (hiding ? '숨는 시간' : '남은 시간') + '</div><div class="big-t">' + fmt(left) + '</div><div style="font-size:18px;font-weight:700">' + (m.state === 'out' ? '관전 중' : (m.role === 'chaser' ? cw() : rw())) + '</div></div>' +
    '<div style="display:flex;flex-direction:column;gap:8px;width:100%;max-width:420px">' + notes.map(n => '<div class="note">' + esc(n) + '</div>').join('') + '</div>' +
    '<div style="display:flex;flex-direction:column;align-items:center;gap:10px"><button class="unlock" data-unlock="1" aria-label="길게 눌러서 잠금 풀기"><svg class="ring" width="96" height="96" viewBox="0 0 96 96" aria-hidden="true"><circle id="unlockRing" cx="48" cy="48" r="44" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="' + circ + '" stroke-dashoffset="' + (circ * (1 - pct)) + '"/></svg><svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="#fff" stroke-width="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="#fff" stroke-width="2"/></svg></button><div class="sub" style="color:#C9CED6">자물쇠를 1초 동안 꾹 누르면 풀려요<br>경고음·진동·알림은 잠금 중에도 와요</div></div></div>';
}

// 사진 압축 (약 200KB)
$('#photoInput').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f) return;
  C.sending = true; render();
  try {
    const url = URL.createObjectURL(f);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    let w = img.naturalWidth, h = img.naturalHeight, max = 1280;
    let data = '';
    for (let tries = 0; tries < 6; tries++) {
      const k = Math.min(1, max / Math.max(w, h));
      const cv = document.createElement('canvas'); cv.width = Math.round(w * k); cv.height = Math.round(h * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      data = cv.toDataURL('image/jpeg', 0.72);
      if (data.length < 270000) break;
      max = Math.round(max * 0.8);
    }
    URL.revokeObjectURL(url);
    send({ type:'photo', data });
  } catch(err) { toast('사진을 읽지 못했어요. 다시 찍어 주세요'); }
  C.sending = false; render();
});

// 아이폰만 나침반 권한 버튼이 필요해요 (다른 폰은 바로 됨)
const COMPASS = { heading:null, needPerm: IS_IOS && typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function', listening:false, granted:false, denied:false };
function onOrient(e){
  let h = null;
  if (typeof e.webkitCompassHeading === 'number' && !isNaN(e.webkitCompassHeading)) h = e.webkitCompassHeading; // 아이폰
  else if (e.absolute && e.alpha != null) h = 360 - e.alpha; // 안드로이드 (북쪽 기준)
  if (h == null) return;
  const so = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  h = (h + so + 360) % 360;
  if (COMPASS.heading == null) COMPASS.heading = h;
  else { const d = ((h - COMPASS.heading + 540) % 360) - 180; COMPASS.heading = (COMPASS.heading + d * 0.35 + 360) % 360; } // 흔들림 줄이기
  COMPASS.last = Date.now();
  if (!COMPASS.raf) COMPASS.raf = requestAnimationFrame(() => { COMPASS.raf = 0; drawRadarShapes(); });
}
function startCompass(){
  if (COMPASS.listening) return; COMPASS.listening = true;
  if ('ondeviceorientationabsolute' in window) window.addEventListener('deviceorientationabsolute', onOrient, true);
  window.addEventListener('deviceorientation', onOrient, true);
}
async function askCompass(){
  try {
    if (COMPASS.needPerm) { const r = await DeviceOrientationEvent.requestPermission(); if (r === 'denied') { COMPASS.denied = true; render(); return; } }
    COMPASS.granted = true; startCompass();
  } catch(e) { COMPASS.denied = true; }
  render();
}
startCompass(); // 신호는 권한이 있을 때만 들어와요 (안드로이드는 바로, 아이폰은 허용 후)

// ===================== 레이더 (잡는 쪽) =====================
function radarState(){
  const st = C.st, m = me(); if (!st || !m || st.phase !== 'playing' || !m.radar) return null;
  const s = st.settings, now = Date.now();
  const active = !s.radarCooldown || now < (C.radarUntil || 0);
  const coolLeft = s.radarCooldown && !active ? Math.max(0, ((C.radarUntil || 0) + s.radarCooldown * 1000 - now) / 1000) : 0;
  let range = 0, sight = 0;
  if (active && s.radarRangeOn) m.radar.forEach(t => { if (t.d <= s.radarRangeDist) range = Math.max(range, 1 - t.d / s.radarRangeDist); });
  const sightUsable = s.radarSightOn && !C.locked && COMPASS.heading != null;
  if (active && sightUsable) {
    const half = s.radarSightAngle / 2;
    m.radar.forEach(t => {
      if (t.d > s.radarSightDist) return;
      const dd = Math.abs(((t.b - COMPASS.heading + 540) % 360) - 180);
      if (dd > half) return; // 시야각 밖이면 아예 소리 없음
      sight = Math.max(sight, 0.5 * (1 - dd / half) + 0.5 * (1 - t.d / s.radarSightDist));
    });
  }
  return { s, active, coolLeft, range, sight, sightUsable };
}
function tone(f, dur, vol, at){
  if (!audio) return;
  try { const t = at || audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
    o.type = 'square'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + dur + 0.02); } catch(e){}
}
(function rangeLoop(){
  const R = radarState(); let wait = 300;
  if (R && R.range > 0) { if (C.sound && audio) tone(620, 0.09, 0.05 + 0.4 * R.range); buzz(30); wait = 1200 - 950 * R.range; }
  setTimeout(rangeLoop, wait);
})();
(function sightLoop(){
  const R = radarState(); let wait = 200;
  if (R && R.sight > 0) { if (C.sound && audio) { const t = audio.currentTime, v = 0.05 + 0.4 * R.sight; tone(1500, 0.05, v, t); tone(1850, 0.05, v, t + 0.07); } wait = 1000 - 800 * R.sight; }
  setTimeout(sightLoop, wait);
})();
function bars(level, cls){ const n = Math.round(level * 5); let h = '<div class="bars ' + cls + '">'; for (let i = 0; i < 5; i++) h += '<i class="' + (i < n ? 'on' : '') + '"></i>'; return h + '</div>'; }
function radarPanel(){
  const R = radarState(); if (!R) return '';

  if (s.radarRangeOn) h += '<div class="rrow"><span class="l">범위</span>' + bars(R.range, 'range') + '</div>';

  if (s.radarSightOn && COMPASS.heading != null && !C.locked) h += '<div class="sub small" style="text-align:center">폰을 세워 들고 앞을 비춰보세요</div>';
  if (s.radarCooldown > 0) h += R.active ? '<div class="sub small" style="text-align:center;color:#1F6B2A;font-weight:700">레이더 작동 중 · ' + Math.ceil(((C.radarUntil || 0) - Date.now()) / 1000) + '초</div>'
    : R.coolLeft > 0 ? '<div class="sub small" style="text-align:center">레이더 쉬는 중 · ' + Math.ceil(R.coolLeft) + '초</div>'
    : '<button class="mid" data-act="radarGo" style="min-height:44px">레이더 켜기 (' + dur(s.radarActive) + ')</button>';
  return h + '</div>';
}
// 지도 위 내 범위 원·시야 부채꼴
function drawRadarShapes(){
  const map = C.gmap, st = C.st, m = me();
  const want = map && C.screen === 'game' && st && st.phase === 'playing' && m && m.role === 'chaser' && m.state === 'alive' && C.pos;
  const s = st && st.settings;
  if (!want || !s.radarRangeOn) { if (C.rangeCircle) { C.rangeCircle.remove(); C.rangeCircle = null; } }
  else {
    const ll = [C.pos.lat, C.pos.lng];
    if (!C.rangeCircle || C.rangeCircle._map !== map) C.rangeCircle = L.circle(ll, { radius:s.radarRangeDist, color:'#E8590C', weight:1.5, dashArray:'4 6', fillOpacity:0.04, interactive:false }).addTo(map);
    else { C.rangeCircle.setLatLng(ll); C.rangeCircle.setRadius(s.radarRangeDist); }
  }
  if (!want || !s.radarSightOn || COMPASS.heading == null) { if (C.cone) { C.cone.remove(); C.cone = null; } return; }
  const half = s.radarSightAngle / 2, R = s.radarSightDist, lat = C.pos.lat, lng = C.pos.lng;
  const kLat = 1 / 111320, kLng = 1 / (111320 * Math.cos(lat * Math.PI / 180));
  const pts = [[lat, lng]];
  for (let a = -half; a <= half + 0.01; a += 5) { const br = (COMPASS.heading + a) * Math.PI / 180; pts.push([lat + Math.cos(br) * R * kLat, lng + Math.sin(br) * R * kLng]); }
  const style = C.locked ? { color:'#9AA1AC', fillColor:'#9AA1AC' } : { color:'#1F6FEB', fillColor:'#1F6FEB' };
  if (!C.cone || C.cone._map !== map) C.cone = L.polygon(pts, Object.assign({ weight:1.5, fillOpacity:0.15, interactive:false }, style)).addTo(map);
  else { C.cone.setLatLngs(pts); C.cone.setStyle(style); }
}

// ===================== 경고음 반복 =====================
let lastPhotoAlert = false;
setInterval(() => {
  const m = me(); if (!m || !C.st) return;
  const inGame = C.st.phase === 'playing';
  if (inGame && m.state !== 'out' && (m.outsideLeft != null || m.jailOutLeft != null)) { if (C.sound) siren(0.9); buzz([500,100,300]); }
  const ph = m.photoLeft != null;
  if (ph && !lastPhotoAlert) { if (C.sound) siren(0.6); buzz([200,100,200,100,200]); }
  lastPhotoAlert = ph;
}, 1000);

// ===================== 시작 =====================
if (!window.L) { document.body.innerHTML = '<div style="padding:40px 20px;font-family:sans-serif">지도 기능을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.</div>'; return; }
if (C.code && C.name) connect();
else if (C.code && !C.name) C.code = null;
render();
})();
</script>
